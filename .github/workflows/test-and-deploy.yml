name: Test and Deploy
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run automatically at 8AM PST Monday-Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-x64
    if: github.repository_owner == 'sendgrid'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        java: [ 8, 11 ]
    env:
      DOCKER_LOGIN: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_AUTH_TOKEN }}
    steps:
      - name: Checkout sendgrid-java
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Login to Docker Hub
        if: env.DOCKER_LOGIN
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_AUTH_TOKEN }}

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Run Unit Tests
        run: make test-docker version=${{ matrix.java }}

  deploy:
    name: Deploy
    if: success() && github.ref_type == 'tag' && github.repository_owner == 'sendgrid'
    needs: [ test ]
    runs-on: ubuntu-x64
    permissions:
      contents: write
    steps:
      - name: Checkout sendgrid-java
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The release action verifies refs/tags/<tag> in the local clone.
          fetch-depth: 0

      - name: Set up Sonatype Maven
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '8'
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Install dependencies and Build Release Artifacts
        run: make install

      - name: Create GitHub Release
        uses: twilio/sdk-actions/github-release@9b1c3222c9ffe38aadedb11c5b9f5a172b5e9951 # v1
        with:
          assets: sendgrid-java.jar
          changelog-file: CHANGELOG.md
          footer: '**[Maven](https://mvnrepository.com/artifact/com.sendgrid/sendgrid-java/${{ github.ref_name }})**'

      - name: Publish to Maven
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn clean deploy -DskipTests=true -B -U -Prelease

#      - name: Submit metric to Datadog
